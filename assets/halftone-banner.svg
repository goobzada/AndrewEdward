<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#0E121E"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>

    <!-- Spectrum Gradient for World Map Dots -->
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d65620"/>
      <stop offset="20%" stop-color="#ec652b"/>
      <stop offset="40%" stop-color="#9f7aee"/>
      <stop offset="60%" stop-color="#4575cd"/>
      <stop offset="80%" stop-color="#44b48b"/>
      <stop offset="100%" stop-color="#f4df69"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowPulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseRing {
        0% { r: 3; opacity: 1; }
        50% { r: 16; opacity: 0; }
        100% { r: 3; opacity: 0; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes packetMove {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .ring1 { animation: pulseRing 2.8s infinite ease-out; transform-origin: center; }
      .ring2 { animation: pulseRing 3.2s infinite ease-out 0.9s; transform-origin: center; }
      .ring3 { animation: pulseRing 2.5s infinite ease-out 1.5s; transform-origin: center; }
      .data-line { stroke-dasharray: 6, 6; animation: dashFlow 20s linear infinite; }
      .card-float { animation: floatSlow 6s ease-in-out infinite; }
      .cursor-blink { animation: blink 1s infinite; }
      .mono-text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans-text { font-family: 'SuisseIntl', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="420" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid overlay -->
  <g opacity="0.12" stroke="#4575cd" stroke-width="0.5">
    <line x1="0" y1="70" x2="960" y2="70"/>
    <line x1="0" y1="140" x2="960" y2="140"/>
    <line x1="0" y1="210" x2="960" y2="210"/>
    <line x1="0" y1="280" x2="960" y2="280"/>
    <line x1="0" y1="350" x2="960" y2="350"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
  </g>

  <!-- Halftone Dotted World Map Silhouette -->
  <g fill="url(#spectrumGrad)" opacity="0.38">
    <!-- North America -->
    <circle cx="140" cy="110" r="2.5"/><circle cx="155" cy="110" r="3"/><circle cx="170" cy="110" r="2.5"/><circle cx="185" cy="110" r="2"/><circle cx="200" cy="110" r="3"/>
    <circle cx="125" cy="125" r="3"/><circle cx="140" cy="125" r="3.5"/><circle cx="155" cy="125" r="3.5"/><circle cx="170" cy="125" r="4"/><circle cx="185" cy="125" r="3.5"/><circle cx="200" cy="125" r="3"/><circle cx="215" cy="125" r="2.5"/>
    <circle cx="110" cy="140" r="2.5"/><circle cx="125" cy="140" r="3.5"/><circle cx="140" cy="140" r="4"/><circle cx="155" cy="140" r="4"/><circle cx="170" cy="140" r="4"/><circle cx="185" cy="140" r="3.5"/><circle cx="200" cy="140" r="3.5"/><circle cx="215" cy="140" r="3"/><circle cx="230" cy="140" r="2"/>
    <circle cx="125" cy="155" r="3"/><circle cx="140" cy="155" r="4"/><circle cx="155" cy="155" r="4"/><circle cx="170" cy="155" r="4"/><circle cx="185" cy="155" r="4"/><circle cx="200" cy="155" r="3.5"/><circle cx="215" cy="155" r="3"/>
    <circle cx="140" cy="170" r="3"/><circle cx="155" cy="170" r="3.5"/><circle cx="170" cy="170" r="3.5"/><circle cx="185" cy="170" r="3.5"/><circle cx="200" cy="170" r="3"/><circle cx="215" cy="170" r="2.5"/>
    <circle cx="155" cy="185" r="2.5"/><circle cx="170" cy="185" r="3"/><circle cx="185" cy="185" r="2.5"/><circle cx="200" cy="185" r="2"/>
    <circle cx="170" cy="200" r="2"/><circle cx="185" cy="200" r="2"/>

    <!-- South America -->
    <circle cx="215" cy="230" r="2.5"/><circle cx="230" cy="230" r="3"/><circle cx="245" cy="230" r="2.5"/>
    <circle cx="215" cy="245" r="3"/><circle cx="230" cy="245" r="4"/><circle cx="245" cy="245" r="4"/><circle cx="260" cy="245" r="3"/>
    <circle cx="215" cy="260" r="3"/><circle cx="230" cy="260" r="4"/><circle cx="245" cy="260" r="4"/><circle cx="260" cy="260" r="3.5"/><circle cx="275" cy="260" r="2.5"/>
    <circle cx="230" cy="275" r="3.5"/><circle cx="245" cy="275" r="4"/><circle cx="260" cy="275" r="3.5"/><circle cx="275" cy="275" r="2"/>
    <circle cx="230" cy="290" r="3"/><circle cx="245" cy="290" r="3.5"/><circle cx="260" cy="290" r="3"/>
    <circle cx="230" cy="305" r="2.5"/><circle cx="245" cy="305" r="2.5"/><circle cx="260" cy="305" r="2"/>
    <circle cx="230" cy="320" r="2"/><circle cx="245" cy="320" r="2"/>

    <!-- Europe -->
    <circle cx="440" cy="100" r="2.5"/><circle cx="455" cy="100" r="3"/><circle cx="470" cy="100" r="3"/><circle cx="485" cy="100" r="2.5"/>
    <circle cx="425" cy="115" r="3"/><circle cx="440" cy="115" r="3.5"/><circle cx="455" cy="115" r="4"/><circle cx="470" cy="115" r="4"/><circle cx="485" cy="115" r="3.5"/><circle cx="500" cy="115" r="3"/>
    <circle cx="425" cy="130" r="3"/><circle cx="440" cy="130" r="3.5"/><circle cx="455" cy="130" r="4"/><circle cx="470" cy="130" r="4"/><circle cx="485" cy="130" r="3.5"/><circle cx="500" cy="130" r="3"/><circle cx="515" cy="130" r="2.5"/>
    <circle cx="440" cy="145" r="3"/><circle cx="455" cy="145" r="3.5"/><circle cx="470" cy="145" r="3.5"/><circle cx="485" cy="145" r="3"/>

    <!-- Africa -->
    <circle cx="440" cy="175" r="3"/><circle cx="455" cy="175" r="3.5"/><circle cx="470" cy="175" r="3.5"/><circle cx="485" cy="175" r="3"/><circle cx="500" cy="175" r="2.5"/>
    <circle cx="440" cy="190" r="3.5"/><circle cx="455" cy="190" r="4"/><circle cx="470" cy="190" r="4"/><circle cx="485" cy="190" r="4"/><circle cx="500" cy="190" r="3.5"/><circle cx="515" cy="190" r="3"/>
    <circle cx="455" cy="205" r="4"/><circle cx="470" cy="205" r="4"/><circle cx="485" cy="205" r="4"/><circle cx="500" cy="205" r="3.5"/>
    <circle cx="455" cy="220" r="3.5"/><circle cx="470" cy="220" r="3.5"/><circle cx="485" cy="220" r="3.5"/>
    <circle cx="470" cy="235" r="3"/><circle cx="485" cy="235" r="3"/><circle cx="500" cy="235" r="2.5"/>
    <circle cx="470" cy="250" r="2.5"/><circle cx="485" cy="250" r="2.5"/>
    <circle cx="470" cy="265" r="2"/>

    <!-- Asia -->
    <circle cx="530" cy="100" r="2.5"/><circle cx="545" cy="100" r="3"/><circle cx="560" cy="100" r="3"/><circle cx="575" cy="100" r="3"/><circle cx="590" cy="100" r="3"/><circle cx="605" cy="100" r="3"/><circle cx="620" cy="100" r="2.5"/>
    <circle cx="530" cy="115" r="3"/><circle cx="545" cy="115" r="3.5"/><circle cx="560" cy="115" r="4"/><circle cx="575" cy="115" r="4"/><circle cx="590" cy="115" r="4"/><circle cx="605" cy="115" r="4"/><circle cx="620" cy="115" r="3.5"/><circle cx="635" cy="115" r="3"/><circle cx="650" cy="115" r="3"/><circle cx="665" cy="115" r="2.5"/>
    <circle cx="545" cy="130" r="3"/><circle cx="560" cy="130" r="3.5"/><circle cx="575" cy="130" r="4"/><circle cx="590" cy="130" r="4"/><circle cx="605" cy="130" r="4"/><circle cx="620" cy="130" r="4"/><circle cx="635" cy="130" r="3.5"/><circle cx="650" cy="130" r="3.5"/><circle cx="665" cy="130" r="3"/><circle cx="680" cy="130" r="3"/>
    <circle cx="560" cy="145" r="3"/><circle cx="575" cy="145" r="3.5"/><circle cx="590" cy="145" r="4"/><circle cx="605" cy="145" r="4"/><circle cx="620" cy="145" r="4"/><circle cx="635" cy="145" r="3.5"/><circle cx="650" cy="145" r="3.5"/><circle cx="665" cy="145" r="3"/><circle cx="680" cy="145" r="3"/>
    <circle cx="590" cy="160" r="3"/><circle cx="605" cy="160" r="3.5"/><circle cx="620" cy="160" r="3.5"/><circle cx="635" cy="160" r="3"/><circle cx="650" cy="160" r="3"/>
    <circle cx="605" cy="175" r="3"/><circle cx="620" cy="175" r="3"/><circle cx="635" cy="175" r="2.5"/>

    <!-- Australia & Pacific -->
    <circle cx="700" cy="260" r="2.5"/><circle cx="715" cy="260" r="3"/><circle cx="730" cy="260" r="3"/><circle cx="745" cy="260" r="2.5"/>
    <circle cx="685" cy="275" r="3"/><circle cx="700" cy="275" r="3.5"/><circle cx="715" cy="275" r="4"/><circle cx="730" cy="275" r="4"/><circle cx="745" cy="275" r="3"/>
    <circle cx="700" cy="290" r="3"/><circle cx="715" cy="290" r="3.5"/><circle cx="730" cy="290" r="3"/><circle cx="745" cy="290" r="2.5"/>
    <circle cx="715" cy="305" r="2.5"/><circle cx="730" cy="305" r="2"/>
  </g>

  <!-- Network Arcs / Data Flow -->
  <g fill="none" stroke-linecap="round">
    <!-- SF to NY -->
    <path d="M 140 140 Q 175 110 215 125" stroke="#ec652b" stroke-width="1.5" class="data-line" opacity="0.8"/>
    <!-- NY to London/Zurich -->
    <path d="M 215 125 Q 330 60 455 115" stroke="#9f7aee" stroke-width="1.8" class="data-line" opacity="0.85"/>
    <!-- Zurich to Tokyo -->
    <path d="M 455 115 Q 560 50 680 130" stroke="#44b48b" stroke-width="1.8" class="data-line" opacity="0.85"/>
    <!-- NY to São Paulo -->
    <path d="M 215 125 Q 260 190 260 260" stroke="#4575cd" stroke-width="1.5" class="data-line" opacity="0.75"/>
    <!-- London to Singapore/Sydney -->
    <path d="M 455 115 Q 580 200 715 275" stroke="#71d2f0" stroke-width="1.5" class="data-line" opacity="0.7"/>
  </g>

  <!-- Pulsing Hub Nodes -->
  <!-- Silicon Valley -->
  <g transform="translate(140, 140)">
    <circle r="6" fill="#ec652b" opacity="0.3" class="ring1"/>
    <circle r="3.5" fill="#ec652b" filter="url(#glowPulse)"/>
    <circle r="1.5" fill="#ffffff"/>
  </g>

  <!-- New York (US Hub) -->
  <g transform="translate(215, 125)">
    <circle r="7" fill="#c6ff41" opacity="0.3" class="ring2"/>
    <circle r="4" fill="#c6ff41" filter="url(#glowPulse)"/>
    <circle r="1.8" fill="#ffffff"/>
  </g>

  <!-- London / Zurich (Swiss Tech Hub) -->
  <g transform="translate(455, 115)">
    <circle r="8" fill="#9f7aee" opacity="0.3" class="ring3"/>
    <circle r="4.5" fill="#9f7aee" filter="url(#glowPulse)"/>
    <circle r="2" fill="#ffffff"/>
  </g>

  <!-- Tokyo Hub -->
  <g transform="translate(680, 130)">
    <circle r="6" fill="#f4df69" opacity="0.3" class="ring1"/>
    <circle r="3.5" fill="#f4df69" filter="url(#glowPulse)"/>
    <circle r="1.5" fill="#ffffff"/>
  </g>

  <!-- São Paulo Hub -->
  <g transform="translate(260, 260)">
    <circle r="6" fill="#4575cd" opacity="0.3" class="ring2"/>
    <circle r="3.5" fill="#4575cd" filter="url(#glowPulse)"/>
    <circle r="1.5" fill="#ffffff"/>
  </g>

  <!-- LEFT HERO TYPOGRAPHY & BRANDING -->
  <g transform="translate(48, 56)">
    <!-- FDIC / Swiss Tech Trust Badge -->
    <rect width="210" height="26" rx="13" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="14" cy="13" r="3.5" fill="#c6ff41"/>
    <text x="26" y="17" fill="#ECECEC" font-size="10.5" font-weight="600" class="mono-text" letter-spacing="1">BRANCO DEV // ARCHITECT</text>

    <!-- Main Title -->
    <text x="0" y="70" fill="#FFFFFF" font-size="34" font-weight="700" class="sans-text" letter-spacing="-0.8">ANDREW EDWARD</text>
    
    <!-- Tagline -->
    <text x="0" y="100" fill="#88888E" font-size="13" font-weight="400" class="sans-text">High-Concurrency SaaS • AI Systems • Cloud Architecture</text>

    <!-- Terminal Code Typing Box -->
    <g transform="translate(0, 126)">
      <rect width="400" height="136" rx="8" fill="#011821" fill-opacity="0.9" stroke="#167e6c" stroke-width="1"/>
      
      <!-- Window Controls -->
      <circle cx="16" cy="16" r="4" fill="#ec652b"/>
      <circle cx="28" cy="16" r="4" fill="#f4df69"/>
      <circle cx="40" cy="16" r="4" fill="#44b48b"/>
      <text x="60" y="19" fill="#7c7f88" font-size="10" class="mono-text">core/orchestrator.ts</text>

      <!-- Code Content -->
      <text x="16" y="48" fill="#167e6c" font-size="11.5" class="mono-text">const <tspan fill="#44b48b">system</tspan> = new <tspan fill="#9f7aee">BrancoArchitecture</tspan>({</text>
      <text x="30" y="70" fill="#7c7f88" font-size="11.5" class="mono-text">stack: [<tspan fill="#94efb7">'Next.js 16'</tspan>, <tspan fill="#94efb7">'Go'</tspan>, <tspan fill="#94efb7">'PostgreSQL'</tspan>],</text>
      <text x="30" y="92" fill="#7c7f88" font-size="11.5" class="mono-text">aiAgents: <tspan fill="#ec652b">true</tspan>, latency: <tspan fill="#f4df69">'&lt;12ms'</tspan>, status: <tspan fill="#44b48b">'ACTIVE'</tspan></text>
      <text x="16" y="114" fill="#167e6c" font-size="11.5" class="mono-text">});<tspan fill="#c6ff41" class="cursor-blink"> ▋</tspan></text>
    </g>

    <!-- Value Proposition Motto -->
    <text x="0" y="300" fill="#c6ff41" font-size="11" font-weight="600" class="mono-text" letter-spacing="2">BUILD • AUTOMATE • SCALE</text>
  </g>

  <!-- RIGHT FLOATING TRANSACTION / ARCHITECTURE WIDGET (FINTECH COLUMN STYLE) -->
  <g transform="translate(560, 48)" class="card-float" filter="url(#cardShadow)">
    <!-- White Card Surface -->
    <rect width="350" height="290" rx="8" fill="#ffffff" stroke="#e3e4e8" stroke-width="1"/>
    
    <!-- Card Header -->
    <g transform="translate(24, 28)">
      <rect width="32" height="32" rx="6" fill="#111a4a"/>
      <path d="M 8 16 L 16 8 L 24 16 L 16 24 Z" fill="#c6ff41"/>
      <text x="44" y="14" fill="#111a4a" font-size="14" font-weight="600" class="sans-text">InfraForge OS</text>
      <text x="44" y="28" fill="#7c7f88" font-size="11" class="sans-text">Autonomous AI Cluster</text>
      <rect x="230" y="4" width="68" height="22" rx="11" fill="#44b48b" fill-opacity="0.15"/>
      <circle cx="242" cy="15" r="3" fill="#167e6c"/>
      <text x="250" y="19" fill="#167e6c" font-size="10" font-weight="600" class="mono-text">HEALTHY</text>
    </g>

    <line x1="24" y1="80" x2="326" y2="80" stroke="#e3e4e8" stroke-width="1"/>

    <!-- High Signal Metric: Signal Orange Card (Column/Brex Style) -->
    <g transform="translate(24, 96)">
      <rect width="302" height="68" rx="8" fill="#ec652b"/>
      <text x="16" y="24" fill="#ffffff" fill-opacity="0.8" font-size="11" font-weight="500" class="sans-text">GLOBAL AI ROUTING &amp; DISPATCH</text>
      <text x="16" y="52" fill="#ffffff" font-size="22" font-weight="700" class="sans-text">99.999% <tspan font-size="13" font-weight="400">Uptime</tspan></text>
      <path d="M 200 48 Q 230 20 250 38 T 285 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Telemetry Stats List -->
    <g transform="translate(24, 182)">
      <!-- Row 1 -->
      <text x="0" y="16" fill="#3b3e47" font-size="12" font-weight="500" class="sans-text">Avg API Response Latency</text>
      <text x="302" y="16" text-anchor="end" fill="#167e6c" font-size="12" font-weight="600" class="mono-text">11.4 ms</text>
      <line x1="0" y1="28" x2="302" y2="28" stroke="#f6f6f8" stroke-width="1.5"/>

      <!-- Row 2 -->
      <text x="0" y="48" fill="#3b3e47" font-size="12" font-weight="500" class="sans-text">Active Multi-Tenant Shards</text>
      <text x="302" y="48" text-anchor="end" fill="#111a4a" font-size="12" font-weight="600" class="mono-text">64 Nodes</text>
      <line x1="0" y1="60" x2="302" y2="60" stroke="#f6f6f8" stroke-width="1.5"/>

      <!-- Row 3 -->
      <text x="0" y="80" fill="#3b3e47" font-size="12" font-weight="500" class="sans-text">Security &amp; Edge Protection</text>
      <text x="302" y="80" text-anchor="end" fill="#44b48b" font-size="12" font-weight="600" class="mono-text">TLS 1.3 / mTLS</text>
    </g>
  </g>

  <!-- Bottom Footer Bar in Banner -->
  <g transform="translate(48, 388)">
    <circle cx="6" cy="6" r="3" fill="#44b48b"/>
    <text x="18" y="10" fill="#7c7f88" font-size="10.5" class="mono-text">GLOBAL HUBS: NYC • SILICON VALLEY • AUSTIN • MIAMI • ZURICH • SÃO PAULO</text>
    <text x="864" y="10" text-anchor="end" fill="#44b48b" font-size="10.5" font-weight="600" class="mono-text">BRANCODEV.COM ↗</text>
  </g>
</svg>
